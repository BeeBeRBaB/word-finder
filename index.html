<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Resolves the appearance before first paint. src/main.js is a module and therefore
     deferred, so without this a dark-mode player gets a flash of the light palette on
     every single load. There is no module-based equivalent that runs early enough, so
     this has to duplicate the decision inline -- but only the decision, not a verbatim
     read-through: the allowlist below (only 'light' or 'dark' pass; anything else,
     including a hand-edited, stale, or future-build value, falls through to the OS
     query) is exactly resolveAppearance(normalizePref(p), prefersDark) from
     src/appearance.js, which is why data-appearance can only ever hold a resolved
     light/dark value -- see styles.css's header comment for that invariant.
     The localStorage read gets its OWN inner try, separate from the outer one: iOS
     Safari's "Block All Cookies" and Chrome with site data blocked (storage.test.js's
     "Safari private mode" case) throw on getItem, and src/appearance.js degrades that
     exact failure to pref='system' and asks the OS. If the outer try caught it instead,
     this script would exit before data-appearance was ever set, the bare :root dark
     default would paint, and the module would then resolve against the OS and repaint
     on hydration -- a flip, the same bug class the allowlist above exists to prevent,
     just reached through the storage read instead of the stored value. Keep the two
     sites in step; the "module blocked entirely" and "allowlist, never verbatim" tests
     in tests/e2e/appearance.spec.js guard this one. -->
<script>try{var p=null;try{p=localStorage.getItem('wordfinder-appearance')}catch(e){}if(p!=='light'&&p!=='dark')p=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.appearance=p}catch(e){}</script>
<title>Word Finder</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16262f">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="hdr">
    <div><div id="kicker">WORD FINDER</div><div id="topic">Loading…</div></div>
    <div id="actions">
      <button id="appearance" type="button" data-pref="system" title="Appearance: System" aria-label="Appearance: System">
        <svg class="i-system" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path class="solid" d="M12 3a9 9 0 0 0 0 18z"/></svg>
        <svg class="i-light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.6"/><path d="M12 2v2.6M12 19.4V22M2 12h2.6M19.4 12H22M4.9 4.9l1.9 1.9M17.2 17.2l1.9 1.9M19.1 4.9l-1.9 1.9M6.8 17.2l-1.9 1.9"/></svg>
        <svg class="i-dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.6 8.6 0 1 0 11.1 11.1z"/></svg>
      </button>
      <button id="newbtn" type="button">&#8635; New game</button>
    </div>
  </div>
  <div id="main">
    <div id="gridbox"><div id="pills"></div><div id="letters"></div><div id="fx"></div></div>
    <div id="side">
      <div id="listhdr"><b>WORDS</b><span id="count"></span></div>
      <div id="list"></div>
      <div id="hint">Drag across a word in the grid to find it, then tap it here to cross it out.</div>
    </div>
  </div>
</div>
<div id="win"><div id="wincard">
  <button id="winclose" type="button" aria-label="Close">&times;</button>
  <div class="big">&#127881;</div><h2>Puzzle solved!</h2><p id="winmsg"></p>
  <button id="winbtn" type="button">Play a new game &#8594;</button>
</div></div>
<div id="confirm"><div id="confirmcard">
  <p>Start a new game? Your progress will be lost.</p>
  <div><button id="confirm-cancel" type="button">Cancel</button>
  <button id="confirm-ok" type="button">New game</button></div>
</div></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
